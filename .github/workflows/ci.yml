name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff==0.16.4 pytest

      - name: Lint
        run: ruff check mcp_simple_pubmed/

      - name: Tests
        run: pytest -q

      - name: Smoke test
        env:
          PUBMED_EMAIL: ci@example.com
        run: |
          python -c "
          import asyncio
          from fastmcp import Client
          import mcp_simple_pubmed.server as server

          async def main():
              async with Client(server.app) as c:
                  return {t.name for t in await c.list_tools()}

          tools = asyncio.run(main())
          missing = {'search_pubmed', 'get_paper_fulltext'} - tools
          assert not missing, f'unregistered tools: {missing}'
          print('registered tools:', sorted(tools))
          "
