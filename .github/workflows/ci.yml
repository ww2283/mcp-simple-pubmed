name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Lint
        run: ruff check mcp_simple_pubmed/

      - name: Smoke test
        env:
          PUBMED_EMAIL: ci@example.com
        run: |
          python -c "
          import asyncio
          import mcp_simple_pubmed.server as server
          tools = asyncio.run(server.app.get_tools())
          expected = {'search_pubmed', 'get_paper_fulltext'}
          missing = expected - set(tools)
          assert not missing, f'unregistered tools: {missing}'
          print('registered tools:', sorted(tools))
          "
